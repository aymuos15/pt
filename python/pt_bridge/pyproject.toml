[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pt-bridge"
version = "0.0.0"
description = "PT explicit observational pytest bridge; no auto-plugin or full-result certification"
requires-python = "==3.12.12"
dependencies = ["pytest==8.4.2"]

# Intentionally no pytest11 entry point: ordinary pytest must not load PT.
[tool.hatch.build.targets.wheel]
packages = ["src/pt_bridge"]
