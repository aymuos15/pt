[workspace]
members = ["crates/pt-process", "crates/pt-cli"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
nix = { version = "=0.30.1", features = ["signal", "process"] }
serde_json = "=1.0.145"
signal-hook = "=0.3.18"
tempfile = "=3.23.0"
command-fds = { version = "=0.3.3", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
