[workspace]
members = ["crates/pt-process"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
nix = { version = "=0.30.1", features = ["signal", "process"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
